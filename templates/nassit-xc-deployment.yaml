apiVersion: v1
kind: Service
metadata:
  labels:
    service: {{ .Values.nassitxc.serviceName }}
  # namespace: {{ .Values.nassitxc.nameSpace }}
  name: {{ .Values.nassitxc.serviceName }}
spec:
  type: NodePort
  ports:
    - port: {{ .Values.nassitxc.servicePort }}
      targetPort: {{ .Values.nassitxc.servicePort }}
      nodePort: {{ .Values.nassitxc.nodePort }}
      name: {{ .Values.nassitxc.serviceName }}
  selector:
    service: {{ .Values.nassitxc.serviceName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: {{ .Values.nassitxc.serviceName }}
  name: {{ .Values.nassitxc.serviceName }}
data:
    application.refresh.cache.expiration: "0s"
spec:
  selector:
    matchLabels:
      service: {{ .Values.nassitxc.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.applicationName }}
        component: {{ .Values.nassitxc.serviceName }}
        service: {{ .Values.nassitxc.serviceName }}
    spec:
      containers:
      - name: {{ .Values.nassitxc.serviceName }}
        image: "{{ .Values.nassitxc.imageName }}:{{ .Values.nassitxc.imageTag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        resources:
          requests:
            cpu: "{{ .Values.nassitxc.requests.cpu }}"
            memory: "{{ .Values.nassitxc.requests.memory }}"
          limits:
            cpu: "{{ .Values.nassitxc.requests.cpu }}"
            memory: "{{ .Values.nassitxc.requests.memory }}"
        env:
          - name: DB_HOST
            value: "{{ .Values.nassitxc.environment.DB_HOST }}"
          - name: DB_PORT
            value: "{{ .Values.nassitxc.environment.DB_PORT }}"
          - name: DB_PASS
            value: "{{ .Values.nassitxc.environment.DB_PASS }}"
          - name: DB_USER
            value: "{{ .Values.nassitxc.environment.DB_USER }}"
          - name: DB_NAME
            value: "{{ .Values.nassitxc.environment.DB_NAME }}"
          - name: WILDFLY_USER
            value: "{{ .Values.nassitxc.environment.WILDFLY_USER }}"
          - name: WILDFLY_PASS
            value: {{ .Values.nassitxc.environment.WILDFLY_PASS }}
        command: [ "sh", "-c", "/opt/jboss/wildfly/configure_wildfly.sh" ]
        ports:
        - containerPort: {{ .Values.nassitxc.servicePort }}
      imagePullSecrets:
        - name: {{ .Values.pullSecret }}

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "{{ .Values.nassitxc.serviceName }}-hpa"
spec:
  minReplicas: {{ .Values.nassitxc.minReplicas }}
  maxReplicas: {{ .Values.nassitxc.maxReplicas }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.nassitxc.serviceName }}
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

