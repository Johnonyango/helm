apiVersion: v1
kind: Service
metadata:
  labels:
    service: {{ .Values.xc.serviceName }}
  # namespace: {{ .Values.xc.nameSpace }}
  name: {{ .Values.xc.serviceName }}
spec:
  type: NodePort
  ports:
    - port: {{ .Values.xc.servicePort }}
      targetPort: {{ .Values.xc.servicePort }}
      nodePort: {{ .Values.xc.nodePort_xcbenefits }}
      name: {{ .Values.xc.serviceName }}
  selector:
    service: {{ .Values.xc.serviceName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: {{ .Values.xc.serviceName }}
  name: {{ .Values.xc.serviceName }}
spec:
  selector:
    matchLabels:
      service: {{ .Values.xc.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.applicationName }}
        component: {{ .Values.xc.serviceName }}
        service: {{ .Values.xc.serviceName }}
    spec:
      containers:
      - name: {{ .Values.xc.serviceName }}
        image: "{{ .Values.xc.imageName }}:{{ .Values.xc.imageTag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        # resources:
        #   requests:
        #     cpu: "{{ .Values.xc.requests.cpu }}"
        #     memory: "{{ .Values.xc.requests.memory }}"
        #   limits:
        #     cpu: "{{ .Values.xc.requests.cpu }}"
        #     memory: "{{ .Values.xc.requests.memory }}"
        env:
          - name: DATABASE_URL
            value: "{{ .Values.xc.environment.DATABASE_URL }}"
          - name: DATABASE_PASSWORD
            value: "{{ .Values.xc.environment.DATABASE_PASSWORD }}"
          - name: DATABASE_USERNAME
            value: "{{ .Values.xc.environment.DATABASE_USERNAME }}"
          - name: WILDFLY_USERNAME
            value: "{{ .Values.xc.environment.WILDFLY_USERNAME }}"
          - name: WILDFLY_PASSWORD
            value: "{{ .Values.xc.environment.WILDFLY_PASSWORD }}"
        command: [ "sh", "-c", "/opt/jboss/wildfly/configure_wildfly.sh" ]
        ports:
        - containerPort: {{ .Values.xc.servicePort }}
      imagePullSecrets:
        - name: {{ .Values.pullSecret }}

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "{{ .Values.xc.serviceName }}-hpa"
spec:
  minReplicas: {{ .Values.xc.minReplicas }}
  maxReplicas: {{ .Values.xc.maxReplicas }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.xc.serviceName }}
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

