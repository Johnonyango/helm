apiVersion: v1
kind: Service
metadata:
  labels:
    service: {{ .Values.mss.serviceName }}
  name: {{ .Values.mss.serviceName }}
spec:
  type: NodePort
  ports:
    - port: {{ .Values.mss.servicePort }}
      targetPort: {{ .Values.mss.servicePort }}
      nodePort: {{ .Values.mss.nodePort }}
      name: {{ .Values.mss.serviceName }}
  selector:
    service: {{ .Values.mss.serviceName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: {{ .Values.mss.serviceName }}
  name: {{ .Values.mss.serviceName }}
spec:
  selector:
    matchLabels:
      service: {{ .Values.mss.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.applicationName }}
        component: {{ .Values.mss.serviceName }}
        service: {{ .Values.mss.serviceName }}
    spec:
      containers:
      - name: {{ .Values.mss.serviceName }}
        image: "{{ .Values.mss.imageName }}:{{ .Values.mss.imageTag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.mss.servicePort }}
      imagePullSecrets:
        - name: {{ .Values.pullSecret }}

