apiVersion: v1
kind: Service
metadata:
  labels:
    service: {{ .Values.workflow.serviceName }}
  # namespace: {{ .Values.workflow.nameSpace }}
  name: {{ .Values.workflow.serviceName }}
spec:
  type: NodePort
  ports:
    - port: {{ .Values.workflow.servicePort }}
      targetPort: {{ .Values.workflow.servicePort }}
      nodePort: {{ .Values.workflow.nodePort }}
      name: {{ .Values.workflow.serviceName }}
  selector:
    service: {{ .Values.workflow.serviceName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: {{ .Values.workflow.serviceName }}
  name: {{ .Values.workflow.serviceName }}
spec:
  selector:
    matchLabels:
      service: {{ .Values.workflow.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.applicationName }}
        component: {{ .Values.workflow.serviceName }}
        service: {{ .Values.workflow.serviceName }}
    spec:
      containers:
      - name: {{ .Values.workflow.serviceName }}
        image: "{{ .Values.workflow.imageName }}:{{ .Values.workflow.imageTag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        # resources:
        #   requests:
        #     cpu: "{{ .Values.workflow.requests.cpu }}"
        #     memory: "{{ .Values.workflow.requests.memory }}"
        #   limits:
        #     cpu: "{{ .Values.workflow.requests.cpu }}"
        #     memory: "{{ .Values.workflow.requests.memory }}"
        env:
          - name: DATABASE_URL
            value: "{{ .Values.workflow.environment.DATABASE_URL }}"
          - name: DATABASE_PASSWORD
            value: "{{ .Values.workflow.environment.DATABASE_PASSWORD }}"
          - name: DATABASE_USERNAME
            value: "{{ .Values.workflow.environment.DATABASE_USERNAME }}"
          - name: HIBERNATE_DIALECT
            value: "{{ .Values.workflow.environment.HIBERNATE_DIALECT }}"
          - name: DATABASE_DRIVER_CLASS
            value: "{{ .Values.workflow.environment.DATABASE_DRIVER_CLASS }}"
        ports:
        - containerPort: {{ .Values.workflow.servicePort }}
      imagePullSecrets:
        - name: {{ .Values.pullSecret }}

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "{{ .Values.workflow.serviceName }}-hpa"
spec:
  minReplicas: {{ .Values.workflow.minReplicas }}
  maxReplicas: {{ .Values.workflow.maxReplicas }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.workflow.serviceName }}
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

